name: Rust mod compatibility checks

on:
  push:
    branches: [main]
    paths:
      - 'crates/horizon-jvm/**'
      - 'crates/rust-edition-java/**'
      - 'crates/rust-edition-fabric/**'
      - 'crates/rust-edition-fabric-host/**'
      - 'crates/rust-edition-mod-bridge/**'
      - 'third_party/ristretto_vm/**'
      - 'third_party/ristretto_classloader/**'
      - 'tools/prepare_ristretto_java_home.py'
      - 'tests/test_prepare_ristretto_java_home.py'
      - '.github/workflows/mod-compatibility.yml'
  pull_request:
    paths:
      - 'crates/horizon-jvm/**'
      - 'crates/rust-edition-java/**'
      - 'crates/rust-edition-fabric/**'
      - 'crates/rust-edition-fabric-host/**'
      - 'crates/rust-edition-mod-bridge/**'
      - 'third_party/ristretto_vm/**'
      - 'third_party/ristretto_classloader/**'
      - 'tools/prepare_ristretto_java_home.py'
      - 'tests/test_prepare_ristretto_java_home.py'
      - '.github/workflows/mod-compatibility.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  java-runtime:
    name: Rust bytecode tests against Java 25
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: cargo fmt --manifest-path crates/horizon-jvm/Cargo.toml --all -- --check
      - run: cargo test --manifest-path crates/horizon-jvm/Cargo.toml --locked
      - run: cargo clippy --manifest-path crates/horizon-jvm/Cargo.toml --locked --all-targets -- -D warnings

  java-bridge:
    name: Java code calling Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_EDITION_JAVA25_HOME: ${{ github.workspace }}/.local/ristretto-evaluation/java25-modules-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/crates/rust-edition-java/target
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rust-edition-java
          shared-key: rust-edition-java
      - name: Prepare local Java library files
        run: python3 tools/prepare_ristretto_java_home.py --java-home "$JAVA_HOME"
      - run: python3 -m unittest tests.test_prepare_ristretto_java_home
      - run: cargo fmt --manifest-path crates/rust-edition-java/Cargo.toml --all -- --check
      - run: cargo test --release --manifest-path crates/rust-edition-java/Cargo.toml --locked
      - name: Prepare Java ZIP file support
        run: >-
          python3 tools/prepare_ristretto_java_home.py --java-home "$JAVA_HOME"
          --modules java.base,jdk.zipfs
          --output "$GITHUB_WORKSPACE/.local/ristretto-evaluation/java25-zipfs-home"
      - name: Compare Java module service loading with Java 25
        env:
          RUST_EDITION_JAVA25_HOME: ${{ github.workspace }}/.local/ristretto-evaluation/java25-zipfs-home
        run: cargo test --release --manifest-path crates/rust-edition-java/Cargo.toml --locked --test jmod_service_provider
      - run: cargo clippy --release --manifest-path crates/rust-edition-java/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo fmt --manifest-path crates/rust-edition-fabric-host/Cargo.toml --all -- --check
      - run: cargo test --release --manifest-path crates/rust-edition-fabric-host/Cargo.toml --locked
      - run: cargo clippy --release --manifest-path crates/rust-edition-fabric-host/Cargo.toml --locked --all-targets -- -D warnings

  mod-connection:
    name: Game and helper messages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --locked -p rust-edition-mod-bridge
      - run: cargo clippy --locked -p rust-edition-mod-bridge --all-targets -- -D warnings

  fabric-metadata:
    name: Read Fabric mod files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rust-edition-fabric
          shared-key: rust-edition-fabric
      - run: cargo fmt --manifest-path crates/rust-edition-fabric/Cargo.toml --all -- --check
      - run: cargo test --manifest-path crates/rust-edition-fabric/Cargo.toml --locked
      - run: cargo clippy --manifest-path crates/rust-edition-fabric/Cargo.toml --locked --all-targets -- -D warnings
